[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Editions on soul layers
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/card_draw.lua"]'
pattern = '''if edition.apply_to_float and self.children.floating_sprite then'''
position = "at"
payload = '''if (edition.apply_to_float or self.config.center.poke_apply_soul_edition) and not self.config.center.poke_skip_soul_edition and self.children.floating_sprite then'''
match_indent = true
